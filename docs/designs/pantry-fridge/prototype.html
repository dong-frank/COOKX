<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>COOKX 囤囤鼠交互设计</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8ece3;color:#253e2c;font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;min-height:100vh}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #b98a46;outline-offset:3px}.device{position:relative;width:390px;height:844px;overflow:hidden;border-radius:34px;background:#faf8f2;box-shadow:0 18px 70px #24432d1c;border:1px solid #d4dbce}.status{height:42px;padding:13px 25px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:600}.battery{font-size:12px;letter-spacing:3px}.app-header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:relative;z-index:3}.app-header h1{font-size:25px;font-weight:600;margin:0;letter-spacing:1px}.add{width:42px;height:42px;border:none;border-radius:50%;background:#e0eadd;color:#34634c;font-size:28px;font-weight:400;display:grid;place-items:center;line-height:1}.scene{position:absolute;inset:100px 0 80px;background:radial-gradient(ellipse at 50% 66%,#eef1e7 0%,#faf8f2 70%)}.floor{position:absolute;bottom:73px;left:72px;width:246px;height:37px;background:#44603f19;border-radius:50%;filter:blur(13px)}.fridge{position:absolute;top:-15px;left:0;width:390px;height:590px;padding:0;border:0;background:none;color:#34634c}.fridge img{width:100%;height:100%;object-fit:contain;pointer-events:none}.close-fridge{position:absolute;z-index:4;top:120px;right:22px;padding:10px 15px;border:1px solid #d9e1d1;border-radius:24px;background:#faf8f2dd;color:#52664c;font-size:13px}.close-fridge[hidden]{display:none}.sheet{position:absolute;z-index:5;left:0;right:0;bottom:80px;height:214px;background:#fffef9;border-radius:28px 28px 0 0;box-shadow:0 -12px 32px #25422909;padding:0 22px;transform:translateY(470px);transition:transform .32s cubic-bezier(.2,.7,.2,1);visibility:hidden}.device[data-phase="open"] .sheet{transform:translateY(0);visibility:visible}.handle{width:32px;height:4px;background:#d7ddcf;border-radius:3px;margin:11px auto 0}.sheet-header{height:54px;display:flex;align-items:center;justify-content:space-between}.sheet h2{font-size:18px;font-weight:600;margin:0}.count{font-size:13px;color:#89917f}.items{height:197px;overflow-y:auto;scrollbar-width:thin}.item{display:flex;align-items:center;min-height:64px;border-bottom:1px solid #eeeede;gap:12px}.item:last-child{border-bottom:0}.item-main{display:flex;align-items:center;gap:13px;flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 0;color:#304330}.food{width:42px;height:42px;background:#f0f0e5;border-radius:13px;display:grid;place-items:center;font-size:26px;flex:none}.name{font-size:16px;overflow-wrap:anywhere}.availability{border:0;border-radius:20px;min-width:77px;min-height:34px;padding:7px 12px;font-size:12px;color:#34634c;background:#e5eddf}.availability.off{color:#898c80;background:#efeee6}.item.off .food{opacity:.55}.item.off .name{color:#8e9387}.back-items{border:0;background:none;color:#5b7456;padding:8px 0;font-size:14px}.detail-content{padding-top:0}.detail-hero{display:flex;align-items:center;gap:16px;margin:0 0 10px}.detail-hero .food{width:64px;height:64px;font-size:38px;border-radius:20px}.detail-name{font-size:23px;font-weight:600}.detail-label{font-size:14px;color:#7c8877;margin-bottom:12px}.status-options{display:flex;gap:12px}.status-options button{flex:1;min-height:46px;border:1px solid #dbe2d3;border-radius:15px;background:#f7f6ef;color:#7a8472;font-size:14px}.status-options button[aria-pressed="true"]{background:#dfeadd;border-color:#dfeadd;color:#2e603e}.empty{height:220px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:17px}.empty p{margin:0;color:#86927f;font-size:15px}.empty button{border:0;background:#34634c;color:#fff;border-radius:24px;padding:12px 20px}.nav{position:absolute;z-index:8;left:0;right:0;bottom:0;height:80px;background:#f5f3eb;border-top:1px solid #e8e9de;display:flex;align-items:flex-start;padding:9px 8px 15px}.nav button{border:0;background:none;flex:1;display:grid;justify-items:center;gap:4px;color:#8a9381;font-size:11px;padding:0;min-height:48px}.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.nav .nav-icon{width:54px;height:29px;border-radius:18px;display:grid;place-items:center}.nav .active{color:#34634c}.nav .active .nav-icon{background:#dce8d5}.home-indicator{position:absolute;z-index:10;bottom:7px;left:140px;width:110px;height:4px;border-radius:4px;background:#2c4432}.overlay{position:absolute;z-index:12;inset:42px 0 80px;background:#182d2366;display:grid;place-items:center;padding:24px}.overlay[hidden]{display:none}.dialog{width:100%;background:#faf8f2;border-radius:25px;padding:24px;box-shadow:0 18px 40px #152a2330}.dialog h2{font-size:21px;margin:0 0 24px;font-weight:600}.dialog label{display:block;font-size:13px;color:#78866f;margin-bottom:8px}.dialog input{width:100%;padding:13px;border:1px solid #d2dccb;border-radius:12px;background:#fffef9;color:#2c4432}.dialog-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:26px}.dialog-actions button{border:0;background:none;color:#687d5d;padding:10px 15px;border-radius:20px}.dialog-actions .primary{background:#34634c;color:#fff}.dialog-actions button:disabled{opacity:.4}[hidden]{display:none!important}@media(max-width:430px){body{display:block;background:#faf8f2}.device{width:100vw;height:100dvh;min-height:670px;border:0;border-radius:0;box-shadow:none}.fridge{width:100%}.scene{bottom:80px}.fridge{height:calc(100% - 28px);max-height:590px}.floor{bottom:45px}.sheet{height:min(214px,32dvh)}.items{height:calc(100% - 17px)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.quantity{font-size:16px;color:#557348;white-space:nowrap;padding-left:12px}.detail-quantity{font-size:22px;color:#34634c}.quantity-label{margin-top:16px}.empty{height:185px}.item-main{min-height:62px}.detail-name{flex:1;min-width:0;overflow-wrap:anywhere}.detail-quantity{white-space:nowrap}
.scene-visual{position:absolute;top:-15px;left:0;width:100%;height:min(590px,100%)}.scene-visual>img{position:absolute;width:100%;height:100%;object-fit:contain;pointer-events:none}.scene-visual .fridge,.seasoning-bottles{position:absolute;padding:0;border:0;background:transparent;border-radius:10px;max-height:none;min-height:0}.seasoning-bottles:focus-visible,.fridge:focus-visible{outline:3px solid #b98a46;outline-offset:3px}.device[data-phase="spices"] .sheet{transform:translateY(0);visibility:visible}.device[data-phase="spices"] .seasoning-bottles{box-shadow:0 0 0 2px #547b482c}.items{height:197px}.home-indicator{left:50%;transform:translateX(-50%)}@media(max-width:430px){.scene-visual{height:calc(100% - 28px);max-height:590px}}
</style>
</head>
<body>
<main class="device" id="device" data-phase="closed" aria-label="囤囤鼠界面设计预览">
 <div class="status" aria-hidden="true"><span>9:41</span><span class="battery">▂▄▆ ▰</span></div>
 <header class="app-header"><h1>囤囤鼠</h1><button class="add" id="add" aria-label="登记物品">＋</button></header>
 <div class="scene"><div class="scene-visual" id="scene-visual"><img id="frame" src="frames/00.png" alt="冰箱在左，右侧为保留水槽及左侧柜体的厨房操作台，水槽左侧有三个调料瓶"><button class="fridge" id="fridge" aria-label="打开冰箱"></button><button class="seasoning-bottles" id="seasoning-bottles" aria-label="查看调料" aria-expanded="false"></button></div></div>
 <section class="sheet" id="sheet" aria-label="物品" inert>
  <div class="handle" aria-hidden="true"></div>
  <div id="list-view"><div class="items" id="items"></div></div>
  <div id="detail-view" hidden><div class="sheet-header"><button class="back-items" id="back-items">〈 物品</button></div><div class="detail-content"><div class="detail-hero"><span class="food" id="detail-icon"></span><span class="detail-name" id="detail-name"></span><span id="detail-quantity" class="detail-quantity"></span></div></div></div>
 </section>
 <nav class="nav" aria-label="主导航">
  <button aria-disabled="true"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v6m3-6v6M5 7h3M6.5 10v10m9-16c-3 3-3 8 0 8h2V4zm1 8v8"/></svg></span>菜谱</button>
  <button aria-disabled="true"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v11h14V10m-10 11v-7h6v7"/></svg></span>家庭</button>
  <button class="active" aria-current="page"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M5 9h14m-3-4v2m0 5v4"/></svg></span>囤囤鼠</button>
  <button aria-disabled="true"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3z"/></svg></span>助手</button>
 </nav><div class="home-indicator" aria-hidden="true"></div>
 <div class="overlay" id="overlay" hidden><form class="dialog" id="add-form" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">登记物品</h2><label for="item-name">物品名称</label><input id="item-name" maxlength="64" autocomplete="off"><label for="item-quantity" class="quantity-label">数量</label><input id="item-quantity" maxlength="32" autocomplete="off"><div class="dialog-actions"><button type="button" id="cancel">取消</button><button type="submit" class="primary" id="confirm-add" disabled>登记</button></div></form></div>
</main>
<script>
(()=>{
 const device=document.getElementById('device'),frame=document.getElementById('frame'),sheet=document.getElementById('sheet'),fridge=document.getElementById('fridge'),rack=document.getElementById('seasoning-bottles');
 const q=new URLSearchParams(location.search);let phase='closed',progress=0,selected=null,mode='fridge';
 const fridgeStock=q.has('empty')?[]:[{id:1,name:'番茄',icon:'🍅',available:true,quantityText:'3 个'},{id:2,name:'胡萝卜',icon:'🥕',available:true,quantityText:'2 根'},{id:3,name:'牛奶',icon:'🥛',available:true,quantityText:'1 盒'},{id:4,name:'鸡蛋',icon:'🥚',available:false,quantityText:'0 个'}];
 const spiceStock=q.has('empty')?[]:[{id:101,name:'盐',icon:'🧂',available:true,quantityText:'半罐'},{id:102,name:'黑胡椒',icon:'🫙',available:true,quantityText:'1 罐'},{id:103,name:'辣椒粉',icon:'🌶️',available:true,quantityText:'半罐'}];
 function currentStock(){return mode==='spices'?spiceStock:fridgeStock;}
 function visibleItems(){return currentStock().filter(x=>x.available);}
 function placeTargets(){const el=document.getElementById('scene-visual'),w=el.clientWidth,h=el.clientHeight,ih=Math.min(h,w*640/480),iw=ih*.75,ox=(w-iw)/2,oy=(h-ih)/2;[[fridge,[.065,.175,.38,.835]],[rack,[.415,.395,.655,.525]]].forEach(([el,b])=>{el.style.left=(ox+b[0]*iw)+'px';el.style.top=(oy+b[1]*ih)+'px';el.style.width=((b[2]-b[0])*iw)+'px';el.style.height=((b[3]-b[1])*ih)+'px';});}window.addEventListener('resize',placeTargets);placeTargets();
 const frames=Array.from({length:20},(_,i)=>{const img=new Image();img.src=`frames/${String(i).padStart(2,'0')}.png`;return img;});
 const listView=document.getElementById('list-view'),detailView=document.getElementById('detail-view'),items=document.getElementById('items');
 function setPhase(v){phase=v;device.dataset.phase=v;sheet.inert=!['open','spices'].includes(v);rack.disabled=v==='opening'||v==='closing';rack.setAttribute('aria-expanded',String(v==='spices'));rack.setAttribute('aria-label',v==='spices'?'收起调料':'查看调料');fridge.disabled=v==='opening'||v==='closing';fridge.setAttribute('aria-label',v==='open'?'关闭冰箱':'打开冰箱');fridge.setAttribute('aria-expanded',String(v==='open'));}
 function setFrame(v){progress=v;frame.src=frames[Math.max(0,Math.min(19,Math.round(v*19)))].src;frame.alt=v>.9?'左侧冰箱打开，右侧为保留水槽及左侧柜体的厨房操作台，水槽左侧有三个调料瓶':'左侧冰箱关闭，右侧为保留水槽及左侧柜体的厨房操作台，水槽左侧有三个调料瓶';}
 function showList(){selected=null;detailView.hidden=true;listView.hidden=false;render();}
 function render(){items.replaceChildren();const shown=visibleItems();
  if(!shown.length){const box=document.createElement('div');box.className='empty';const label=document.createElement('p');label.textContent=mode==='spices'?'还没有调料':'还没有物品';const add=document.createElement('button');add.textContent=mode==='spices'?'登记调料':'登记物品';add.onclick=openAdd;box.append(label,add);items.append(box);return;}
  shown.forEach(item=>{const row=document.createElement('div');row.className='item';const main=document.createElement('button');main.className='item-main';main.setAttribute('aria-label',`查看${item.name}，${item.quantityText||'未填数量'}`);const icon=document.createElement('span');icon.className='food';icon.textContent=item.icon;icon.setAttribute('aria-hidden','true');const name=document.createElement('span');name.className='name';name.textContent=item.name;main.append(icon,name);main.onclick=()=>showDetail(item.id);const quantity=document.createElement('span');quantity.className='quantity';quantity.textContent=item.quantityText||'未填数量';row.append(main,quantity);items.append(row);});
 }
 function showDetail(id){const item=visibleItems().find(x=>x.id===id);if(!item)return;selected=id;listView.hidden=true;detailView.hidden=false;document.getElementById('detail-icon').textContent=item.icon;document.getElementById('detail-name').textContent=item.name;document.getElementById('detail-quantity').textContent=item.quantityText||'未填数量';}
 function animate(open,after){if(phase==='opening'||phase==='closing')return;showList();const start=performance.now(),from=progress,to=open?1:0;setPhase(open?'opening':'closing');const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?50:850;
  function tick(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,3);setFrame(from+(to-from)*ease);if(t<1)requestAnimationFrame(tick);else {setPhase(open?'open':'closed');if(after)after();}}
  requestAnimationFrame(tick);
 }
 fridge.onclick=()=>{mode='fridge';animate(phase!=='open');};
 function showSpices(){mode='spices';showList();setPhase('spices');}
 rack.onclick=()=>{if(phase==='spices'){setPhase('closed');return;}if(phase==='open')animate(false,showSpices);else showSpices();};document.getElementById('back-items').onclick=showList;
 const overlay=document.getElementById('overlay'),input=document.getElementById('item-name'),quantityInput=document.getElementById('item-quantity'),confirm=document.getElementById('confirm-add');
 function openAdd(){document.getElementById('dialog-title').textContent=mode==='spices'?'登记调料':'登记物品';overlay.hidden=false;input.value='';quantityInput.value='';confirm.disabled=true;input.focus();}
 function closeAdd(){overlay.hidden=true;document.getElementById('add').focus();}
 document.getElementById('add').onclick=openAdd;document.getElementById('cancel').onclick=closeAdd;input.oninput=()=>confirm.disabled=!input.value.trim();
 document.getElementById('add-form').onsubmit=e=>{e.preventDefault();const name=input.value.trim(),quantityText=quantityInput.value.trim();if(!name)return;const isZero=/^0(?:\.0+)?\s*(?:个|根|盒|克|千克|毫升|升|袋|瓶|包|份|g|kg|ml|l)?$/i.test(quantityText);const existing=currentStock().find(x=>x.name===name);if(existing){existing.available=!isZero;existing.quantityText=quantityText;}else currentStock().push({id:Date.now(),name,icon:'🥬',available:!isZero,quantityText});closeAdd();showList();if(mode==='spices')setPhase('spices');else if(phase==='closed')animate(true);};
 document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!overlay.hidden)closeAdd();else if(selected!==null)showList();else if(phase==='open')animate(false);else if(phase==='spices')setPhase('closed');});
 render();if(q.get('state')==='spices')showSpices();if(['open','detail'].includes(q.get('state'))){setFrame(1);setPhase('open');if(q.get('state')==='detail'&&visibleItems().length)showDetail(visibleItems()[0].id);}
 window.pantryDesign={open:()=>{mode='fridge';animate(true);},spices:showSpices,close:()=>{if(phase==='spices')setPhase('closed');else animate(false);},getState:()=>({phase,progress,mode,count:visibleItems().length,selected,items:currentStock().map(x=>({...x}))})};
})();

</script>
</body></html>
